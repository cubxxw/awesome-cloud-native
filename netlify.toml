[build]
  base = "."
  publish = ".build-artifacts/verified-docs/dist"
  command = "npm ci --include=dev --ignore-scripts --strict-peer-deps --engine-strict && npm test && npm audit --audit-level=low && npm run docs:build:verified"

[build.environment]
  NODE_VERSION = "22.23.2"
  NPM_VERSION = "12.0.2"
  NPM_FLAGS = "--include=dev --ignore-scripts --strict-peer-deps --engine-strict --no-audit --no-fund"
  NODE_OPTIONS = "--max-old-space-size=2048"
  RAYON_NUM_THREADS = "1"
